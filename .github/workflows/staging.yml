name: DEPLOY STAGING

on:
  push:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build with tsup
        run: npm run build

  deploy-server-1:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: DEPLOY TO SERVER 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
                echo "==> DEPLOYING ON SERVER"
                cd ~/donation-app
                git checkout development
                git pull origin development
                echo "==> CODE PULLED"
              
                /root/.nvm/versions/node/v23.11.0/bin/npm install
                echo "==> DEPENDENCIES INSTALLED"
              
                /root/.nvm/versions/node/v23.11.0/bin/npm run build
                echo "==> BUILD SUCCESSFUL"
              
                /root/.nvm/versions/node/v23.11.0/bin/pm2 stop donation || echo "PM2 process not found"
                /root/.nvm/versions/node/v23.11.0/bin/pm2 start dist/index.js --name donation
                echo "==> APP STARTED WITH PM2"